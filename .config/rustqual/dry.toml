# Structural quality checks, DRY pass: duplicates and dead code over production
# code only.
#
# Paired with `config.toml`, which runs every other dimension across the full
# workspace. See that file for why the two passes are split.
#
# Excluding test files here is safe because nothing in this pass depends on
# them: `[test_quality]` is off, so TQ-003 cannot mistake an untested-looking
# function for a real finding, and DRY-002 already ignores calls from
# `#[cfg(test)]` code when deciding deadness (the dead-code count is 256 with
# and without these globs). What the exclusion removes is ~2038 DRY-003
# fragments and ~210 DRY-001 duplicate test functions, both of which are the
# deliberate self-contained-test shape rather than copy-paste.
#
# Two non-DRY rules still fire in this pass: IOSP (`iosp/violation`) has no
# `enabled` key, and `CX-003` (`MAGIC_NUMBER`) survives `[complexity] enabled =
# false` even though every other complexity rule is silenced. `qual.toml`
# collects only `DRY-*` rules from this pass, so the CI gate takes both rules
# from the main pass alone.
#
# With `[complexity]` disabled, `rustqual` has no complexity finding to match a
# `qual:allow(complexity, …)` marker against, so this pass reports every such
# marker as `ORPHAN_SUPPRESSION`, even though `MAGIC_NUMBER` still fires. The CI
# gate ignores those because only `DRY-*` rules are collected here; whether a
# marker is stale is decided in the main pass.

exclude_files = [
    "**/*_tests.rs",
    "**/tests.rs",
    "**/tests/**",
]

# `DRY-004` (wildcard imports) is covered by `clippy::wildcard_imports` (enabled
# via `clippy::pedantic`). The workspace explicitly allows
# `clippy::enum_glob_use`, and all 10 `DRY-004` findings on 2026-11-11 were enum
# glob imports (T-0yh5m6r).
#
# `DRY-005` (repeated match) groups matches by their normalized shape, which
# drops variant names, so unrelated enums whose arms all return a string literal
# land in one group. Re-enable once the vendored rustqual groups by the matched
# type (T-1dhk659).
[duplicates]
enabled                 = true
detect_wildcard_imports = false
detect_repeated_matches = false

[boilerplate]
enabled = false

[complexity]
enabled = false

[srp]
enabled = false

[coupling]
enabled = false

[structural]
enabled = false

[test_quality]
enabled = false

[architecture]
enabled = false
