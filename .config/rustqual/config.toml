# Structural quality checks, main pass: every dimension except DRY, across the
# full workspace including test files.
#
# Run via `just qual`; gated on CI by `just qual-ci`.
#
# ## Why DRY is disabled here
#
# rustqual's DRY dimension is all-or-nothing. Turning off `[duplicates]`
# disables DRY-002 (dead code) and DRY-006 (dead types) along with DRY-003
# (repeated fragments)
#
# DRY-003 fires ~2038 times inside `*_tests.rs`, on the repeated setup blocks
# that make each `#[test]` self-contained. That shape is deliberate here (see
# the testing guidance in the contributor docs: prefer duplication over a
# shared fixture helper), so those findings are noise rather than signal.
#
# The resolution is a second pass, `dry.toml`, which enables DRY over
# production code only. Test files cannot simply be excluded from *this* pass
# instead, because doing so would take the Test Quality dimension with them:
# TQ-001/002/003 all need `#[test]` functions in the parse.

[duplicates]
enabled = false

# rustqual's default of 300 is its own house style, not JP's. Only code lines
# count: blank lines, `//`, `///` and block comments don't, and counting stops
# at the first `#[cfg(test)]` in the file. `SRP-002` also fires on the
# independent-cluster cohesion check, so raising the line limit alone does not
# eliminate all `SRP-002` findings. Decided in T-0yh5m6r.
#
# `lcom4_threshold`: `SRP-001` scores a struct on cohesion (LCOM4, weight 0.4),
# field count, method count and fan-out, and fires at 0.6. At rustqual's default
# of 2, two method groups already score the full 0.4, so a one-field command
# struct whose `run` doesn't read `self` fires on fan-out alone. At 3, two
# groups score half of that and three or more score all of it.
#
# `max_independent_clusters`: the cluster half of `SRP-002` is off, set far
# beyond any real file because rustqual has no switch for it. A finding gives a
# count and doesn't name the clusters, so there is nothing to act on. Restore
# the default of 2 once the vendored rustqual names them (T-1dhk659).
[srp]
file_length              = 800
lcom4_threshold          = 3
max_independent_clusters = 1_000_000

# `.expect()` counts as an error-handling finding (`A20`), the same as
# `.unwrap()`, `panic!` and `unreachable!`. A deliberate `.expect()` with a
# documented `# Panics` section takes a `qual:allow` with a reason, so each one
# is visible in review. If those markers ever approach `max_suppression_ratio`
# (5%), raise the ratio rather than allowing `.expect()` wholesale. Decided in
# T-0yh5m6r.
[complexity]
allow_expect = false

# Thresholds for test code: `*_tests.rs` files, which rustqual recognizes through
# their `#[cfg(test)] #[path = "…"] mod tests;` declaration, and `tests/`
# directories. JP's tests are self-contained by design, so they run long.
#
# - `file_length`: no limit. Set far beyond any real file, because rustqual
#   cannot disable the check for test files alone.
# - `max_function_lines`: 150 (compared to 60 for production code). Of the 185
#   test functions over 60 lines on 2026-10-07, 14 are over 150. The limit is a
#   starting point; individual cases are decided as they come up.
#
# Decided in T-0yh5m6r.
[tests]
file_length        = 1_000_000
max_function_lines = 150

# A rule that clippy covers as well or better is off (T-0yh5m6r):
#
# - `SLM` (a method that never uses `self`) is `clippy::unused_self`, which the
#   workspace runs through `clippy::pedantic`. rustqual ignores
#   `#[expect(clippy::unused_self)]`, so every deliberate case would need a
#   second marker.
# - `NMS` (`&mut self` that is never mutated) is
#   `clippy::needless_pass_by_ref_mut`. rustqual reads syntax, so it reports a
#   method that hands out `&mut` to a field, or mutates through a method call.
#   Run over the workspace on 2026-11-11, the clippy lint reported none of the
#   22 `NMS` findings and 20 parameters that `NMS` missed. T-1haa4rr tracks
#   enabling it.
[structural]
check_slm = false
check_nms = false
