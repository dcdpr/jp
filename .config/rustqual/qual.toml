# Rule policy for `qual` (`crates/internal/qual`), which compares `rustqual`
# findings between a base revision and the working tree.
#
# A rule pattern is a SARIF rule ID (`CX-001`, `DRY-002`, `iosp/violation`) or
# a prefix followed by `*`.

# Rules that never fail the gate and are omitted from reports.
#
# Rules covered by Clippy or prone to AST-only false positives are disabled
# (T-0yh5m6r). Rules with a config toggle are disabled in `config.toml` or
# `dry.toml`; rules without a toggle are exempted here.
exempt = [
    # rustqual cannot disable it, and the 862 existing violations (6.2% of
    # functions) exceed the 5% `max_suppression_ratio`, so per-function
    # suppressions are not an option.
    "iosp/violation",

    # Parameter count: covered by `clippy::too_many_arguments`, configured via
    # `too-many-arguments-threshold` in `.clippy.toml`.
    "SRP-003",

    # Manual `Default` impls: covered by `clippy::derivable_impls`.
    "BP-005",

    # Inconsistent error types in a module. False-positives on serde
    # `serialize`/`deserialize` functions, whose error types are fixed by the
    # serde traits. Re-enable once the vendored rustqual skips trait-signature
    # error types (T-1dhk659).
    "IET",

    # Trivial `Display` impls. False-positives on multi-value `write!` calls and
    # format-preserving delegation alongside genuine newtype boilerplate.
    # Re-enable once the vendored rustqual distinguishes them (T-1dhk659).
    "BP-002",

    # The rest of the boilerplate rules. Of the 256 findings on 2026-11-11, 65
    # are in test files (`BP-009` repeated struct construction, `BP-010`
    # repeated format strings), where each test spelling out its own setup is
    # deliberate. The others mostly ask for a derive the workspace doesn't have
    # or that doesn't apply: `BP-007` treats any enum with several `From` impls
    # as an error enum, `BP-006` flags a mapping between two crates' enums, and
    # `BP-003`/`BP-004` flag hand-written setters and `with_*` methods.
    # Re-enable rule by rule once the vendored rustqual skips test code for
    # them and tells these cases apart (T-1dhk659).
    "BP-001",
    "BP-003",
    "BP-004",
    "BP-006",
    "BP-007",
    "BP-008",
    "BP-009",
    "BP-010",
]

# Rules with zero findings on `main`. Any finding for an enforced rule fails the
# gate, even if it already existed at the base revision. Rules are only ever
# added to this list.
#
# `CX-006` (`unsafe`) will be added here once every existing site carries an
# audited `qual:allow(unsafe) reason: "…"`. After that, any unmarked `unsafe`
# block fails the gate. `unsafe` markers do not count toward
# `max_suppression_ratio` (T-0yh5m6r).
enforced = []

# Each rule is collected from the first pass whose `rules` pattern matches it
# and ignored in later passes. This deduplicates rules that `dry.toml` cannot
# disable (`iosp/violation` and `CX-003` magic numbers) and ignores
# `ORPHAN_SUPPRESSION` warnings caused by disabled dimensions in `dry.toml`.

[[pass]]
name = "dry"
config = "dry.toml"
rules = ["DRY-*"]

[[pass]]
name = "main"
config = "config.toml"
rules = ["*"]
