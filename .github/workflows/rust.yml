name: rust
on:
  pull_request:
  push:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  JUST_TIMESTAMP: true
  JUST_COLOR: always
  JUST_EXPLAIN: true
  JUST_VERBOSE: 4
  CARGO_PROFILE_LINT_DEBUG: 0
  CARGO_PROFILE_DOCS_DEBUG: 0
  CARGO_PROFILE_COVERAGE_DEBUG: line-tables-only
  CARGO_PROFILE_NEXTEST_DEBUG: 0
  # `shear` builds under `dev` and `insta` under `test`. Full DWARF in those
  # profiles makes up most of their cached `target/` directories.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
  # Use content checksums instead of file mtimes for cargo's fingerprints.
  # `actions/checkout` rewrites source mtimes on every run, which would
  # otherwise invalidate cached workspace-crate artifacts even when the
  # content is unchanged. See rust-lang/cargo#14136.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  # sccache refuses to cache incremental compiles, which cargo uses for
  # workspace members by default, and it hashes every `CARGO_*` variable into
  # its cache keys. rust-cache exports this same value, but the Windows job
  # skips rust-cache, so setting it here keeps the keys identical across jobs.
  CARGO_INCREMENTAL: "0"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      fmt: ${{ steps.filter.outputs.fmt }}
      fmt-comments: ${{ steps.filter.outputs.fmt-comments }}
      fmt-markdown: ${{ steps.filter.outputs.fmt-markdown }}
      typecheck-js: ${{ steps.filter.outputs.typecheck-js }}
      test: ${{ steps.filter.outputs.test }}
      docs: ${{ steps.filter.outputs.docs }}
      coverage: ${{ steps.filter.outputs.coverage }}
      deny: ${{ steps.filter.outputs.deny }}
      insta: ${{ steps.filter.outputs.insta }}
      shear: ${{ steps.filter.outputs.shear }}
      vet: ${{ steps.filter.outputs.vet }}
      qual: ${{ steps.filter.outputs.qual }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > changed-files.txt
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt
            else
              git diff --name-only "$before" HEAD > changed-files.txt
            fi
          fi

          matches() {
            grep -Eq "$1" changed-files.txt
          }

          set_task() {
            if matches "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          workflow='^\.github/workflows/rust\.yml$'
          justfile='^justfile$'
          cargo='(^|/)Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$'
          rust='\.rs$'
          markdown='\.md$|\.markdown$'
          javascript='\.js$|\.d\.ts$|(^|/)tsconfig\.json$'
          snapshots='\.snap$|^\.config/insta\.yaml$'
          source="$rust|$cargo|$workflow|$justfile"

          set_task lint "$source|^\.clippy\.toml$"
          set_task fmt "$rust|^\.rustfmt\.toml$|$workflow|$justfile"
          set_task fmt-comments "$rust|$workflow|$justfile"
          set_task fmt-markdown "$markdown|$workflow|$justfile"
          set_task typecheck-js "$javascript|$workflow|$justfile"
          set_task test "$source|$snapshots"
          set_task docs "$source"
          set_task coverage "$source|$snapshots"
          set_task deny "$cargo|^deny\.toml$|^\.config/supply-chain/|$workflow|$justfile"
          set_task insta "$source|$snapshots"
          set_task shear "$source"
          set_task vet "$cargo|^\.config/supply-chain/|$workflow|$justfile"
          set_task qual "$source|^\.config/rustqual/"
  rust:
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing task must not cancel the others. A cancelled job on `main`
      # never saves its cache, so every pull request starts that task cold, and
      # on a pull request each cancellation hides a failure until the next push.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [lint, fmt, fmt-comments, fmt-markdown, typecheck-js, test, docs, coverage, deny, insta, shear, vet, qual]
        include:
          - task: test
            os: windows-latest
            name_suffix: " (windows)"
            cache_suffix: "-windows"
            # Restoring a 3.9 GB `target/` cache costs Windows more than
            # compiling from a warm sccache does, and restoring `~/.cargo`
            # costs about 12s more than downloading the crates again, so this
            # job skips rust-cache and lets sccache carry compilation.
            rust_cache: "false"
            # sccache cannot cache test binaries (executable targets), and the
            # Windows build already saturates all four runner cores. To shorten
            # PR runs, Windows tests only the crates affected since the PR merge
            # commit's first parent (`HEAD^1`). The Linux `test` job still tests
            # the full workspace on every PR, and `main` tests the full
            # workspace on Windows.
            recipe: ${{ github.ref == 'refs/heads/main' && 'test-ci' || 'test-affected-ci' }}
            scope: ${{ github.ref == 'refs/heads/main' && 'workspace' || 'HEAD^1' }}
            fetch_depth: 2
            # By default, Cargo unifies dependency features only across the
            # selected packages. Testing a crate subset would compile shared
            # dependencies with a narrower feature set than the full workspace
            # build on `main`, missing its sccache entries. Workspace-wide
            # feature unification keeps the feature sets and cache keys
            # identical.
            feature_unification: workspace
          # Expanding macros makes `shear` compile every crate, one after the
          # other, which makes it the slowest job of a pull request run. `main`
          # keeps the expansion, so a dependency used only inside a macro is
          # still checked after every merge.
          - task: shear
            scope: ${{ github.ref == 'refs/heads/main' && 'expand' || 'source' }}
          # `qual-ci` compares `HEAD` against its merge base with `scope`. On a
          # pull request that is the merge commit's first parent, which a depth
          # of 2 reaches. On `main` it is the commit the push replaced, any
          # number of commits back, so the checkout fetches the whole history.
          # A push that creates the branch has the null object ID there, which
          # `qual` reads as no base.
          #
          # The depths are strings because the checkout step falls back to 1 on
          # a falsy value, and the number 0 is falsy where the string is not.
          - task: qual
            scope: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
            fetch_depth: ${{ github.event_name == 'pull_request' && '2' || '0' }}
    name: ${{ matrix.task }}${{ matrix.name_suffix }}
    # A run without a target cache falls back to a full build. Cap it so a
    # pathological run doesn't burn an hour of Windows minutes unnoticed.
    timeout-minutes: 60
    steps:
      - name: Decide whether to run task
        id: task
        shell: bash
        env:
          TASK: ${{ matrix.task }}
          LINT: ${{ needs.changes.outputs.lint }}
          FMT: ${{ needs.changes.outputs.fmt }}
          FMT_COMMENTS: ${{ needs.changes.outputs.fmt-comments }}
          FMT_MARKDOWN: ${{ needs.changes.outputs.fmt-markdown }}
          TYPECHECK_JS: ${{ needs.changes.outputs.typecheck-js }}
          TEST: ${{ needs.changes.outputs.test }}
          DOCS: ${{ needs.changes.outputs.docs }}
          COVERAGE: ${{ needs.changes.outputs.coverage }}
          DENY: ${{ needs.changes.outputs.deny }}
          INSTA: ${{ needs.changes.outputs.insta }}
          SHEAR: ${{ needs.changes.outputs.shear }}
          VET: ${{ needs.changes.outputs.vet }}
          QUAL: ${{ needs.changes.outputs.qual }}
        run: |
          set -euo pipefail

          case "$TASK" in
            lint) run="$LINT" ;;
            fmt) run="$FMT" ;;
            fmt-comments) run="$FMT_COMMENTS" ;;
            fmt-markdown) run="$FMT_MARKDOWN" ;;
            typecheck-js) run="$TYPECHECK_JS" ;;
            test) run="$TEST" ;;
            docs) run="$DOCS" ;;
            coverage) run="$COVERAGE" ;;
            deny) run="$DENY" ;;
            insta) run="$INSTA" ;;
            shear) run="$SHEAR" ;;
            vet) run="$VET" ;;
            qual) run="$QUAL" ;;
            *) echo "unknown task: $TASK" >&2; exit 1 ;;
          esac

          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" != "true" ]; then
            echo "Skipping $TASK because no relevant files changed."
          fi
      - if: ${{ steps.task.outputs.run == 'true' }}
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: ${{ matrix.fetch_depth || 1 }}
      - if: ${{ steps.task.outputs.run == 'true' }}
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        id: restore-cache
        with:
          path: |
            ~/.rustup
          key: toolchain-${{ matrix.task }}${{ matrix.cache_suffix }}-${{ hashFiles('rust-toolchain.toml') }}
          # Prefix match, so a toolchain bump falls back to the previous entry
          # instead of paying for a full rustup download.
          restore-keys: |
            toolchain-${{ matrix.task }}${{ matrix.cache_suffix }}
      - if: ${{ steps.task.outputs.run == 'true' }}
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      # rust-cache prunes `target/` by crate name only, so every stale build of a
      # crate still in the graph survives each save, and a key that changes only
      # with `Cargo.lock` restores and re-saves that growing pile until it no
      # longer fits on the runner's disk. The week in the key starts each cache
      # over, since rust-cache's prefix fallback does not cross key inputs.
      - name: Compute cache week
        if: ${{ steps.task.outputs.run == 'true' }}
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.task.outputs.run == 'true' && matrix.rust_cache != 'false' }}
        uses: Swatinem/rust-cache@7e1e2d0a10862b34e5df481373b2b0f295d1a2ef # v2
        with:
          key: ${{ matrix.task }}-${{ steps.week.outputs.week }}
          cache-bin: false
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ steps.task.outputs.run == 'true' && matrix.task != 'coverage' && matrix.task != 'shear' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # V0.10
      - if: ${{ steps.task.outputs.run == 'true' && matrix.task != 'coverage' && matrix.task != 'shear' }}
        # `bash` is required: on Windows the default shell is PowerShell, where
        # `$GITHUB_ENV` is an empty PowerShell variable rather than a bash env
        # reference, so the redirect silently appends to nothing and the wrapper
        # never propagates to `cargo`.
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # Both `main` and PR runs export these variables because sccache hashes
      # all `CARGO_*` environment variables into its cache keys.
      - if: ${{ steps.task.outputs.run == 'true' && matrix.feature_unification }}
        shell: bash
        run: |
          echo "CARGO_UNSTABLE_FEATURE_UNIFICATION=true" >> "$GITHUB_ENV"
          echo "CARGO_RESOLVER_FEATURE_UNIFICATION=${{ matrix.feature_unification }}" >> "$GITHUB_ENV"
      # `rust-cache` strips `~/.cargo/registry/src` before saving, and the
      # Windows job restores no registry at all, so the first cargo invocation
      # of the job extracts every `.crate` archive, downloading them first on
      # Windows. That is the single most expensive non-build phase there. Doing
      # it in a named step keeps the cost visible instead of burying it in the
      # silent `cargo metadata` that `cargo nextest run` shells out to on
      # startup.
      - name: Warm the registry source tree
        if: ${{ steps.task.outputs.run == 'true' && matrix.task == 'test' }}
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null
      - if: ${{ steps.task.outputs.run == 'true' && matrix.task == 'typecheck-js' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      - if: ${{ steps.task.outputs.run == 'true' }}
        run: just ${{ matrix.recipe || format('{0}-ci', matrix.task) }} ${{ matrix.scope }}
      - if: ${{ matrix.task == 'coverage' && steps.task.outputs.run == 'true' }}
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2
        with:
          file: lcov.info
          fail-on-error: false
      - if: ${{ github.ref == 'refs/heads/main' && steps.task.outputs.run == 'true' && steps.restore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
        with:
          path: |
            ~/.rustup
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
