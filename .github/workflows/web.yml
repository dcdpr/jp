name: web
on:
  pull_request:
  push:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
  JUST_TIMESTAMP: true
  JUST_COLOR: always
  JUST_EXPLAIN: true
  JUST_VERBOSE: 4
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > changed-files.txt
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt
            else
              git diff --name-only "$before" HEAD > changed-files.txt
            fi
          fi

          # The browser crates and the `api` crates they share with their
          # servers, the renderer whose HTML they map, and what decides how they
          # build. See `docs/rfd/139-browser-uis-in-rust-with-leptos.md`.
          browser='^crates/plugins/command/[^/]+/(api|ui)/'
          renderer='^crates/internal/md-html/'
          build='^Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$|^justfile$|^\.github/workflows/web\.yml$'

          if grep -Eq "$browser|$renderer|$build" changed-files.txt; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no browser crate, api crate, md-html, or build input changed."
          fi
  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # A lint failure and a test failure are separate pieces of information.
      fail-fast: false
      matrix:
        task: [lint-web-ci, test-web-ci, build-web-ci]
    name: ${{ matrix.task }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: Swatinem/rust-cache@7e1e2d0a10862b34e5df481373b2b0f295d1a2ef # v2
        with:
          key: web-${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner image ships Chrome and a matching ChromeDriver, which
      # `wasm-bindgen-test-runner` finds through `CHROMEDRIVER`.
      - if: ${{ matrix.task == 'test-web-ci' }}
        run: echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "$GITHUB_ENV"
      - run: just ${{ matrix.task }}
