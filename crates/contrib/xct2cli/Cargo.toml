# Vendored from <https://github.com/landaire/xct2cli> at 9ebb2e0. See README.md
# for what differs from upstream.
[package]
name = "xct2cli"
description = "Reads Xcode Instruments .trace bundles into symbolicated hotspots and callgraphs."
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
version = "0.1.0"

[lib]
name = "xct2cli"
path = "src/lib.rs"

[dependencies]
addr2line = { workspace = true }
camino = { workspace = true }
cpp_demangle = { workspace = true }
gimli = { workspace = true }
object = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
rustc-demangle = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "rc", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true }

# Only the Swift demangler needs `libc`, and only for `dlopen`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The workspace's pedantic lints would mean a few hundred lines of stylistic
# churn against code we did not write, and every line of that churn is a line
# that conflicts on the next sync. The lints that catch mistakes rather than
# taste stay on.
[lints.rust]
future-incompatible = "warn"
nonstandard-style = "warn"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"

# Style lints upstream does not satisfy. Rewriting a match arm into a guard
# inside a hand-rolled XML state machine risks a silently misparsed trace, and
# the rest is taste. Allowed here so the source stays diffable against upstream.
collapsible_match = "allow"
doc_lazy_continuation = "allow"
unnecessary_sort_by = "allow"
