when:
  path: /v1/models/foobarbaz
  method: GET
then:
  status: 404
  header:
    - name: content-type
      value: application/json
  body: |-
    {
      "error": {
        "message": "The model 'foobarbaz' does not exist",
        "type": "invalid_request_error",
        "param": "model",
        "code": "model_not_found"
      }
    }
