when:
  path: /v1/messages
  method: POST
  json_body_str: >-
    {
      "model": "claude-opus-4-6",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "What is 2 + 2?"
            }
          ]
        }
      ],
      "max_tokens": 64000,
      "thinking": {
        "type": "adaptive",
        "display": "summarized"
      },
      "stream": true,
      "output_config": {
        "effort": "high"
      },
      "cache_control": {
        "type": "ephemeral",
        "ttl": "5m"
      }
    }
then:
  status: 200
  header:
    - name: content-type
      value: text/event-stream; charset=utf-8
  body: |+
    event: message_start
    data: {"type":"message_start","message":{"model":"claude-opus-4-6","id":"msg_011CeG89FJxtdX5i4ogFnaaA","type":"message","role":"assistant","content":[],"stop_reason":null,"stop_sequence":null,"stop_details":null,"usage":{"input_tokens":16,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":9,"service_tier":"standard","inference_geo":"global"}}           }
    
    event: content_block_start
    data: {"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}      }
    
    event: ping
    data: {"type": "ping"}
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"4"}   }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":""}    }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":""}  }
    
    event: content_block_stop
    data: {"type":"content_block_stop","index":0}
    
    event: content_block_start
    data: {"type":"content_block_start","index":1,"content_block":{"type":"text","text":""}   }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"2"}          }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":" + 2 = **4**."}      }
    
    event: content_block_stop
    data: {"type":"content_block_stop","index":1      }
    
    event: message_delta
    data: {"type":"message_delta","delta":{"stop_reason":"end_turn","stop_sequence":null,"stop_details":null},"usage":{"input_tokens":16,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"output_tokens":30,"output_tokens_details":{"thinking_tokens":14}}    }
    
    event: message_stop
    data: {"type":"message_stop"               }
    
