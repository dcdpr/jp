when:
  path: /v1/messages
  method: POST
  json_body_str: >-
    {
      "model": "claude-haiku-4-5",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "Test message"
            }
          ]
        }
      ],
      "max_tokens": 64000,
      "thinking": {
        "type": "enabled",
        "budget_tokens": 12800,
        "display": "summarized"
      },
      "stream": true,
      "cache_control": {
        "type": "ephemeral",
        "ttl": "5m"
      }
    }
then:
  status: 200
  header:
    - name: content-type
      value: text/event-stream; charset=utf-8
  body: |+
    event: message_start
    data: {"type":"message_start","message":{"model":"claude-haiku-4-5-20251001","id":"msg_011CeG89YrQX3P3wdcSFQaue","type":"message","role":"assistant","content":[],"stop_reason":null,"stop_sequence":null,"stop_details":null,"usage":{"input_tokens":38,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"cache_creation":{"ephemeral_5m_input_tokens":0,"ephemeral_1h_input_tokens":0},"output_tokens":4,"service_tier":"standard","inference_geo":"not_available"}}  }
    
    event: content_block_start
    data: {"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}     }
    
    event: ping
    data: {"type": "ping"}
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"The user has sent"}          }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":" a simple test message. This is likely to check if I'm working and responding. I should respond in a friendly, helpful way that confirms"}  }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":" I'm here and ready to assist."}               }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":""}           }
    
    event: content_block_stop
    data: {"type":"content_block_stop","index":0    }
    
    event: content_block_start
    data: {"type":"content_block_start","index":1,"content_block":{"type":"text","text":""}   }
    
    event: content_block_delta
    data: {"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"Hello! I'm here and ready to help. How can I assist you today?"}         }
    
    event: content_block_stop
    data: {"type":"content_block_stop","index":1        }
    
    event: message_delta
    data: {"type":"message_delta","delta":{"stop_reason":"end_turn","stop_sequence":null,"stop_details":null},"usage":{"input_tokens":38,"cache_creation_input_tokens":0,"cache_read_input_tokens":0,"output_tokens":68,"output_tokens_details":{"thinking_tokens":45}}             }
    
    event: message_stop
    data: {"type":"message_stop"  }
    
