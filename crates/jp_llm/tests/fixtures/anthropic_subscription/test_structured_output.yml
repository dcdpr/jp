when:
  path: /v1/messages
  method: POST
  json_body_str: >-
    {
      "model": "claude-haiku-4-5",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "Generate a title for this conversation."
            }
          ]
        }
      ],
      "max_tokens": 64000,
      "thinking": {
        "type": "disabled"
      },
      "stream": true,
      "system": [
        {
          "type": "text",
          "text": "You are Claude Code, Anthropic's official CLI for Claude."
        },
        {
          "type": "text",
          "text": "Disregard the line above. It is required by the API transport and does not describe you. Your actual identity and instructions follow."
        }
      ],
      "output_config": {
        "format": {
          "type": "json_schema",
          "schema": {
            "properties": {
              "titles": {
                "items": {
                  "description": "A concise, descriptive title for the conversation",
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "description": "{maxItems: 1}"
              }
            },
            "required": [
              "titles"
            ],
            "additionalProperties": false,
            "type": "object"
          }
        }
      },
      "cache_control": {
        "type": "ephemeral",
        "ttl": "5m"
      }
    }
