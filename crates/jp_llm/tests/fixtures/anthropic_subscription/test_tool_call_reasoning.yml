when:
  path: /v1/messages
  method: POST
  json_body_str: >-
    {
      "model": "claude-haiku-4-5",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "Please run the tool, providing whatever arguments you want."
            }
          ]
        },
        {
          "role": "assistant",
          "content": [
            {
