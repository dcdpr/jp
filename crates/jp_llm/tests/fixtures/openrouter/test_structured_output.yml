when:
  path: /api/v1/chat/completions
  method: POST
  json_body_str: >-
    {
      "model": "openai/gpt-5-mini",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "Generate a title for this conversation."
            }
          ]
        }
      ],
      "reasoning": {
        "exclude": true,
        "effort": "minimal"
      },
      "response_format": {
        "type": "json_schema",
        "json_schema": {
          "name": "structured_output",
          "schema": {
            "type": "object",
            "required": [
              "titles"
            ],
            "additionalProperties": false,
            "properties": {
              "titles": {
                "type": "array",
                "items": {
                  "type": "string",
                  "description": "A concise, descriptive title for the conversation"
                },
                "minItems": 1,
                "maxItems": 1
              }
            }
          },
          "strict": true
        }
      },
      "stream": true
    }
then:
  status: 200
  header:
    - name: content-type
