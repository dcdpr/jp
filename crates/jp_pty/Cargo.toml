[package]
name = "jp_pty"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
# Reads the terminal size the probe binary was given, so a spawn test can assert
# that a resize reached the child.
crossterm = { workspace = true }
# Cross-platform pty: `openpty` on unix, ConPTY on Windows.
portable-pty = { workspace = true }
thiserror = { workspace = true }
# The screen model: what a terminal makes of the bytes, rather than the bytes.
vt100 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `O_NOCTTY`, so opening a pty's subsidiary end never makes it this process's
# controlling terminal.
libc = { workspace = true }

[lints]
workspace = true

# A fixture the spawn tests drive, with no tests of its own: keeps cargo from
# building and listing an empty test binary. The integration tests still get it
# built, and reach it through `CARGO_BIN_EXE_pty_probe`.
[[bin]]
name = "pty_probe"
path = "src/bin/pty_probe.rs"
test = false
