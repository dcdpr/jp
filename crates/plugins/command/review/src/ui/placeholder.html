<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jp-workspace" content="{workspace}">
<title>{workspace} - JP Review</title>
<link rel="icon" type="image/svg+xml" href="/ui/icon.svg">
<link rel="manifest" href="/ui/manifest.webmanifest">
<style>
body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0 auto; max-width: 40rem; padding: 1rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
<h1>JP Review</h1>
<p>This <code>jp-review</code> was built without its browser UI, so the server for <strong>{workspace}</strong> answers only its JSON API, under <a href="/api/reviews"><code>/api/reviews</code></a>.</p>
<p>To serve the UI here, build <code>jp-review</code> with <code>JP_REVIEW_UI</code> set to the directory holding the UI's bundle.</p>
</main>
</body>
</html>
