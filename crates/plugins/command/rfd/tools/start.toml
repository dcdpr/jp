[conversation.tools.rfd_start]
source = "plugin.command.rfd.start"
summary = "Mark an RFD as in development."
description = """
Moves the RFD's tracking ticket to In Progress, which is what the priority
board reports as in development. An RFD without a tracking ticket gets one
first, the way `rfd_track` files it. Only an Accepted or Implemented RFD can be
marked.
"""

examples = """
```json
{"id": "116"}
```
"""

run = "ask"

[conversation.tools.rfd_start.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.rfd_start.parameters.id]
type = "string"
required = true
summary = "The RFD: a number such as `42` or `042`."
