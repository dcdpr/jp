[package]
name = "jp-release"
description = "Record what changes for users as changelog fragments and highlights, and make releases from them."

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

# No `[package.metadata.jp-registry]`: a project installs this plugin with
# `cargo install`, from a checkout or from JP's repository at a pinned revision,
# so it is deliberately absent from the published registry. `jp` finds it on
# `$PATH`.

[dependencies]
changelog = { workspace = true }
doc = { workspace = true }
jp_md = { workspace = true }
jp_plugin = { workspace = true }
jp_tool = { workspace = true }
release-build = { workspace = true }
tool-definitions = { workspace = true }

camino = { workspace = true, features = ["serde1"] }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
comrak = { workspace = true }
humantime = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
shlex = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }
indoc = { workspace = true }
strip-ansi-escapes = { workspace = true }
toml = { workspace = true, features = ["parse", "serde"] }

[lints]
workspace = true

[lib]
name = "jp_release"
path = "src/lib.rs"
doctest = false

# The binary is a shell around the library, and carries no tests of its own.
[[bin]]
name = "jp-release"
path = "src/main.rs"
test = false
