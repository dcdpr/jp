[package]
name = "jp_process"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
# `MockProcessRunner`, for other crates' tests to run commands without spawning
# anything.
mock = []

[dependencies]
camino = { workspace = true }
tokio-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `SIGINT`, so a process asked to stop gets to clean up before it is killed.
libc = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

# A fixture the runner's tests spawn, with no tests of its own: keeps cargo from
# building and listing an empty test binary. The integration tests still get it
# built, and reach it through `CARGO_BIN_EXE_process_probe`.
[[bin]]
name = "process_probe"
path = "src/bin/process_probe.rs"
test = false
