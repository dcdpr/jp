[package]
description = "Compare rustqual findings across git revisions."
name = "qual"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
jp_process = { workspace = true }

camino = { workspace = true }
camino-tempfile = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
# Needed for `Span::start()`/`end()` line numbers during symbol resolution.
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
syn = { workspace = true, features = ["full", "parsing", "printing", "visit"] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["parse", "serde"] }

[dev-dependencies]
jp_process = { workspace = true, features = ["mock"] }

indoc = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }

[lints]
workspace = true

[lib]
doctest = false

# No tests of its own: keeps cargo from building and listing an empty test
# binary.
[[bin]]
name = "qual"
path = "src/main.rs"
test = false
