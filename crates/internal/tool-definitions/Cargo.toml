[package]
description = "The tool definitions a command plugin writes for the tools it serves, and what they mirror from configuration."
name = "tool-definitions"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
jp_label = { workspace = true }
overwrite = { workspace = true }

camino = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# Checks that a declared parameter reaches a plugin in the shape `sync` reads.
jp_config = { workspace = true }

camino-tempfile = { workspace = true }
toml = { workspace = true, features = ["parse", "serde"] }

[lints]
workspace = true

[lib]
doctest = false
