[package]
name = "jp_mcp"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["client"]

# Connect to the MCP servers named in `providers.mcp`.
client = ["rmcp/client", "rmcp/transport-child-process", "rmcp/transport-io"]

# Run JP's tools: local commands, built-ins, and the tools those MCP servers
# declare. Implies `client`, because running an MCP tool means calling one.
server = [
    "client",
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:camino",
    "dep:futures",
    "dep:jp_process",
    "dep:jp_tool",
    "dep:minijinja",
    "dep:reqwest",
    "dep:sse-stream",
    "dep:tokio-util",
    "dep:url",
    "rmcp/server",
    "rmcp/transport-streamable-http-server",
    "rmcp/transport-streamable-http-client",
]

[dependencies]
jp_config = { workspace = true }
jp_process = { workspace = true, optional = true }
jp_tool = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["http1", "tokio"] }
base64 = { workspace = true, optional = true, features = ["std"] }
camino = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
indexmap = { workspace = true }
minijinja = { workspace = true, optional = true, features = [
    "builtins",
    "json",
    "preserve_order",
    "serde",
    "unicode",
] }
reqwest = { workspace = true, optional = true, features = ["json", "stream"] }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
sse-stream = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
which = { workspace = true }

[dev-dependencies]
jp_process = { workspace = true, features = ["mock"] }

assert_matches = { workspace = true }
camino-tempfile = { workspace = true }
# The conformance client speaks JSON-RPC and SSE over plain HTTP by hand, on
# purpose: it must not share a transport with the endpoint it is checking.
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[lib]
doctest = false
