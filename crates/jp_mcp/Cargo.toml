[package]
name = "jp_mcp"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["client"]

# Connect to the MCP servers named in `providers.mcp`.
client = ["rmcp/client", "rmcp/transport-child-process", "rmcp/transport-io"]

# Run JP's tools: local commands, built-ins, and the tools those MCP servers
# declare. Implies `client`, because running an MCP tool means calling one.
server = ["client", "dep:async-trait", "dep:camino", "dep:jp_tool", "dep:minijinja", "dep:tokio-util"]

[dependencies]
jp_config = { workspace = true }
jp_tool = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
indexmap = { workspace = true }
minijinja = { workspace = true, optional = true, features = [
    "builtins",
    "json",
    "preserve_order",
    "serde",
    "unicode",
] }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
which = { workspace = true }

[dev-dependencies]
camino-tempfile = { workspace = true }
assert_matches = { workspace = true }
jp_test = { workspace = true }
test-log = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[lib]
doctest = false
