[package]
name = "jp_plugin"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
# The plugin's end of a connection to the host that lasts as long as the plugin
# runs (`jp_plugin::client`), for plugins such as servers, and logging to the
# host through it (`jp_plugin::log`). `jp` itself, the host, has no use for
# either.
client = ["dep:tokio", "dep:tracing-subscriber"]

[dependencies]
camino = { workspace = true, features = ["serde1"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, optional = true, features = ["registry", "std"] }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
# Provides a paused clock (`start_paused = true`) for the client's timeout tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[lib]
doctest = false
