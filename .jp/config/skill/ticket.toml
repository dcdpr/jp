[[assistant.system_prompt_sections]]
tag = "ticket_skill"
title = "Skill: Tickets"
content = """\
You have been given the ticket skill. Tickets are work items tracked as \
markdown files under `docs/ticket/`, alongside the RFDs. The following tools \
help you with this:

- ticket_list: List tickets in board order, Todo first and the top of each \
column first, with status, labels, and comment count. Filter by status, \
label, or text the ticket mentions; a long listing comes a page at a time.
- ticket_show: Read one ticket's metadata; ask for its description or its \
comments, numbered for replies, when you need them.
- ticket_create: File a new ticket, at status Todo.
- ticket_comment: Append a comment to a ticket's discussion, optionally \
replying to an earlier one.
- ticket_edit: Change a ticket's title, description, status, or labels, any \
of them in one call. Status `done` closes it.

Labels classify tickets: `type` says what kind of work a ticket is (`bug`, \
`feature`, `task`, ...), and the other keys say which part of the system it \
lands in. Each one is a `key=value` pair (`client=cli`, `package=jp_config`), \
and a key may be named more than once, which is how a ticket spanning two \
crates says so. The set is \
closed and lives in `plugins.command.ticket.options.labels`; the tools \
advertise it, and a label outside it is refused. `ticket_edit` writes the \
whole set, so read the ticket first when you mean to keep the labels it \
already carries.

Write a ticket when the work is clear enough to start, and an RFD when it needs \
a design first. The signal is whether there is a decision to argue about, not \
how hard the work is: a subtle rendering bug is a ticket, and a trivially \
implemented policy question is an RFD. A ticket whose discussion turns into a \
disagreement about approach should be promoted to an RFD draft rather than \
settled in its comments.

Find tickets mentioning something with `ticket_list`'s `query`, and use \
`fs_grep_files` over `docs/ticket/` for a pattern; the id in a ticket's \
filename is the one the tools accept.

These tools own the directory: `fs_create_file`, `fs_delete_file`, and \
`fs_move_file` all refuse paths under `docs/ticket/`. `ticket_edit` replaces a \
ticket's whole description; a small change in place is still `fs_modify_file`.
"""

[conversation.tools]
ticket_list = { enable = true, run = "allow", result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_show = { enable = true, run = "allow", result = "allow", style.inline_results = "full", style.results_file_link = "off" }

# The writing tools inherit the workspace's `run = "ask"` default: filing,
# commenting, and editing all leave a diff someone has to review.
ticket_create = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_comment = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_edit = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
