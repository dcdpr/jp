[[assistant.system_prompt_sections]]
tag = "ticket_skill"
title = "Skill: Tickets"
content = """\
You have been given the ticket skill. Tickets are work items tracked as \
markdown files under `docs/ticket/`, alongside the RFDs. The following tools \
help you with this:

- ticket_list: List tickets in board order, Todo first and the top of each \
column first, with status, labels, checklist progress, and comment count. \
Filter by status, label, text the ticket mentions, or the parent it sits \
under; a long listing comes a page at a time.
- ticket_show: Read one ticket's metadata, its checklist progress, its parent, \
and its children; ask for its description, its comments, numbered for \
replies, or its parent's description when you need them.
- ticket_create: File a new ticket, at status Todo, optionally under a parent.
- ticket_comment: Append a comment to a ticket's discussion, optionally \
replying to an earlier one.
- ticket_edit: Change a ticket's title, description, status, labels, \
checklist, or parent, any of them in one call. Status `done` closes it.
- ticket_move: Move a ticket on the board: to another column, directly above \
or below another ticket, or to the top or bottom of its column. Each column is \
a queue worked from the top, so this is how work is prioritized.

Labels classify tickets: `type` says what kind of work a ticket is (`bug`, \
`feature`, `task`, ...), and every ticket carries exactly one; the other keys \
say which part of the system it lands in, or which RFD its work belongs to \
(`tracking-rfd`, `relevant-rfd`). Each one is a `key=value` pair \
(`client=cli`, `package=jp_config`), and a key may be named more than once, \
which is how a ticket spanning two crates says so. The labels live in \
`plugins.command.ticket.options.labels`; the tools describe them, and a \
label outside them, or a ticket without its `type`, is refused. `ticket_edit` \
adds and removes labels, leaving the rest: to change a key a ticket carries \
one of, such as `type`, remove the bare key and add the new label in one call.

Write a ticket when the work is clear enough to start, and an RFD when it needs \
a design first. The signal is whether there is a decision to argue about, not \
how hard the work is: a subtle rendering bug is a ticket, and a trivially \
implemented policy question is an RFD. A ticket whose discussion turns into a \
disagreement about approach should be promoted to an RFD draft rather than \
settled in its comments.

A ticket can sit under one other ticket, its parent. When work splits into \
several items that share one goal, such as the proposals an investigation \
produced:

1. Write the findings themselves, when they are long, as a wiki Snapshot page.
2. File the parent, labelled `type=tracking`: a short brief of what the \
children share, a link to the page, and what finishes the group.
3. File every child with `parent` set, in one `ticket_create` call. Keep each \
child's description to what is its own, and leave the shared context in the \
parent rather than repeating it.

Before starting on a child, read its parent's brief with `ticket_show`'s \
`parent_description`. A parent can't sit under another, and it closes only \
once its children are all `done`; nothing closes it on their behalf.

A ticket's description can hold a checklist: its steps or acceptance \
criteria as markdown task items, `- [ ] item`, one per line. An item is a step \
inside the ticket's work, done in the same change and needing no discussion of \
its own; work that could be picked up, merged, or argued about on its own is a \
ticket of its own, filed under this one as its parent, and leaves the \
checklist when it is filed. Only the \
description holds the checklist, since the tools only ever append comments, so \
move an item someone proposes in a comment into the description.

Check an item off with `ticket_edit`'s `check` as its work lands, naming it by \
a few words of its text, rather than rewriting the description. Before closing \
a ticket, check every item that is done and remove the rest with a comment \
saying why; closing with items unchecked is allowed, and the result names them. \
The `plan` tool tracks your own steps through this conversation and is gone \
with it; a ticket's checklist records the work and outlasts it, so check an \
item when its work lands, not when a step of your plan finishes.

Find tickets mentioning something with `ticket_list`'s `query`, and use \
`fs_grep_files` over `docs/ticket/` for a pattern; the id in a ticket's \
filename is the one the tools accept.

These tools own the directory: `fs_create_file`, `fs_delete_file`, and \
`fs_move_file` all refuse paths under `docs/ticket/`. `ticket_edit` replaces a \
ticket's whole description; a small change in place is still `fs_modify_file`, \
and checking an item off is `ticket_edit`'s `check`.
"""

[conversation.tools]
ticket_list = { enable = true, run = "allow", result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_show = { enable = true, run = "allow", result = "allow", style.inline_results = "full", style.results_file_link = "off" }

# The writing tools inherit the workspace's `run = "ask"` default: filing,
# commenting, editing, and moving all leave a diff someone has to review.
ticket_create = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_comment = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_edit = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
ticket_move = { enable = true, result = "allow", style.inline_results = "full", style.results_file_link = "off" }
