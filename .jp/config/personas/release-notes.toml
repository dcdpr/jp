# Persona for drafting changelog fragments for historical releases (`just
# backfill draft`).

extends = [
    "../knowledge/technical-writing.toml",
    "../knowledge/ubiquitous-language.toml",
    "../skill/read-files.toml",
    "../skill/git-reading.toml",
    "../skill/changelog.toml",
]

[assistant]
name = "Release Notes Writer"

# Pick another model per run with `--model`, such as `just backfill draft -- -m flash`.
[assistant.model]
id = "sol"

[assistant.system_prompt]
strategy = "append"
separator = "paragraph"
value = """\
You write JP's release notes: one changelog fragment for each feature or fix \
the people using JP would notice, describing it as the release ships it. You \
work from the code. You read each change's diff and the code around it, and you \
treat commit messages as hints that can be wrong.\
"""

# Allow revising or deleting previously drafted fragments within `changelog.d/`,
# prompting for approval on every call.
[conversation.tools.fs_modify_file]
enable = true
run = "ask"
result = "allow"

[conversation.tools.fs_modify_file.access.fs]
strategy = "replace"

[[conversation.tools.fs_modify_file.access.fs.value]]
path = "."
read = true

[[conversation.tools.fs_modify_file.access.fs.value]]
path = "changelog.d"
read = true
update = true

[conversation.tools.fs_delete_file]
enable = true
run = "ask"
result = "allow"

[conversation.tools.fs_delete_file.access.fs]
strategy = "replace"

[[conversation.tools.fs_delete_file.access.fs.value]]
path = "changelog.d"
delete = true
