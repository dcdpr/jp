[conversation.tools.rfd_track]
enable = false
source = "plugin.command.rfd.track"
summary = "File or refresh an RFD's tracking ticket."
description = """
The tracking ticket stands for the RFD's implementation as a whole: one ticket
naming the RFD in `Implements` and carrying the label `type=tracking`, with the
RFD's Implementation Plan as its description. Only an Accepted or Implemented
RFD carries one.

An existing tracking ticket is reused, never duplicated. A tool call can't have
the plan read, so a ticket filed here holds the `<!-- rfd-plan: pending -->`
marker in its place until `jp rfd track` runs at a terminal; a description
without the marker is left as it is.
"""

examples = """
```json
{"id": "116"}
```
"""

[conversation.tools.rfd_track.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.rfd_track.parameters.id]
type = "string"
required = true
summary = "The RFD: a number such as `42` or `042`."
