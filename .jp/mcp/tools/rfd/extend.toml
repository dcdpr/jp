[conversation.tools.rfd_extend]
enable = false
run = "ask"
source = "local"
# The recipe takes the extended RFD first, the opposite of the parameters.
command = "just rfd-extend {{tool.arguments.target}} {{tool.arguments.id}}"
description = "Record that RFD `id` extends RFD `target`, updating both documents."

[conversation.tools.rfd_extend.style]
inline_results = "full"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.rfd_extend.parameters.id]
description = "ID of the RFD that extends the other (the newer RFD)."
required = true
type = "string"

[conversation.tools.rfd_extend.parameters.target]
description = "ID of the RFD being extended (the older, established RFD). Not an Abandoned or Superseded one."
required = true
type = "string"
