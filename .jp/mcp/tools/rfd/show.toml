[conversation.tools.rfd_show]
enable = false
source = "plugin.command.rfd.show"
summary = "Read one RFD's metadata and where it stands on the priority board."
description = """
Print an RFD's file, status, category, authors, and date, the RFDs it requires,
extends, or supersedes and those that do the same to it, its place on the
priority board, whether it is in development, which RFDs link to it, and its
summary.

The document itself is not included; read the file it names for that.
"""

examples = """
```json
{"id": "042"}
```

A draft:
```json
{"id": "D05"}
```
"""

[conversation.tools.rfd_show.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.rfd_show.parameters.id]
type = "string"
required = true
summary = "The RFD: a number such as `42` or `042`, or a draft id such as `D05`."
