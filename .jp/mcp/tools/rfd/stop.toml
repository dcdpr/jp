[conversation.tools.rfd_stop]
enable = false
source = "plugin.command.rfd.stop"
summary = "Mark an RFD as no longer in development."
description = """
Moves the RFD's tracking ticket back to Todo, whatever the RFD's status. Phase
tickets are left where they are, and an RFD without a tracking ticket is already
not in development, so nothing is filed.
"""

examples = """
```json
{"id": "116"}
```
"""

[conversation.tools.rfd_stop.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.rfd_stop.parameters.id]
type = "string"
required = true
summary = "The RFD: a number such as `42` or `042`."
