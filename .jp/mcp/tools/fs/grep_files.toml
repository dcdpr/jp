[conversation.tools.fs_grep_files]
enable = false
run = "unattended"

# Paths this tool may read but never returns. Their contents would either flood
# the response or expose something the model has no business seeing. Reading them
# is a separate question, governed by `access.fs` — `.git` in particular stays
# readable, since that is how the write tools check for uncommitted work.
#
# Patterns use `.ignore` syntax, so `**/target/` matches at any depth.
#
# Disclosure blocks like `.git/` belong on every tool that returns contents, so
# keep those in step. `**/target/` is a flood block and lives only on the tools
# that enumerate in bulk; `fs_read_file` omits it deliberately, so an exact build
# log stays retrievable (issue #626).
options.suppress = [".git/", "**/target/"]

source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Grep files in the project's local filesystem."
description = """
Results are grouped by file. Each group opens with a header naming the file and
its match count, followed by the matching lines. A line number followed by `:`
is a match, followed by `-` is a context line, and a bare `--` separates
non-adjacent groups of lines within the same file:

```
crates/jp_cli/src/lib.rs (2 matches)
41-use jp_config::AppConfig;
42:fn build_thread(config: &AppConfig) {
--
88:fn build_thread_from_parts() {
```

If misused, this tool can return *A LOT* of matches, making it difficult to
parse the results. It is recommended to use search patterns that are as specific
as possible to the content you are looking for.

If the output exceeds 200 lines, the `context` option is dropped and the search
is re-run without it. If the output still exceeds 100 lines, only the first 100
are returned. You can re-run the tool with a more specific pattern or limited to
specific paths to narrow down the results with context.
"""

examples = """
Search for a function definition:
```json
{"pattern": "fn build_thread", "paths": ["crates/jp_cli/src"]}
```

Search with context lines:
```json
{"pattern": "ToolDefinition", "context": 3, "paths": ["crates/jp_llm"]}
```

Search across all files:
```json
{"pattern": "TODO|FIXME"}
```
"""

[conversation.tools.fs_grep_files.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.fs_grep_files.parameters.pattern]
type = "string"
required = true
summary = "Regular expression to filter the results by. Lookaround and backreferences are supported."

[conversation.tools.fs_grep_files.parameters.context]
type = "integer"
default = 0
summary = "Number of lines of context to include before and after the matching lines."

[conversation.tools.fs_grep_files.parameters.paths]
type = "array"
items.type = "string"
summary = "Optional list of files or directories to search."
description = """
If unspecified, all files in the project are searched.
"""
