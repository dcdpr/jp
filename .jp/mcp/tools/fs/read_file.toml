[conversation.tools.fs_read_file]
enable = false
run = "unattended"

# Paths this tool may read but never returns. Reading them is a separate
# question, governed by `access.fs` — `.git` in particular stays readable, since
# that is how the write tools check for uncommitted work.
#
# Shorter than the list/grep tools on purpose. Those carry `**/target/` because
# bulk enumeration of build output floods a response; an exact path with a line
# range cannot, and issue #626 asks that build logs stay retrievable when someone
# knows the file they want. Disclosure blocks like `.git/` belong on every tool
# that returns contents; flood blocks belong only where flooding is possible.
options.suppress = [".git/"]
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = """
Read the contents of a file in the project's local filesystem. Do not use it to
show file contents to the user; they will not see the result. Call
`describe_tools` for examples.
"""
description = """
You can use `fs_grep_files` to search for specific patterns in the file
contents, before reading the entire contents of a specific file using this tool.
"""

examples = """
Read an entire file:
```json
{"path": "crates/jp_cli/src/main.rs"}
```

Read a specific line range:
```json
{"path": "crates/jp_llm/src/tool.rs", "start_line": 100, "end_line": 150}
```

Do NOT use this tool to show file contents to the user. They only see that the
tool was called, not its output. To show file contents, write your own
quotation block. For example, this shows the user nothing:

> I can see the culprit. In .jp/config.toml the tool is defined as:
>
> Calling tool fs_read_file(path: ".jp/config.toml", start_line: 240, end_line: 246)
"""

[conversation.tools.fs_read_file.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.fs_read_file.parameters.path]
type = "string"
required = true
summary = "The path to the file to read."

[conversation.tools.fs_read_file.parameters.start_line]
type = "integer"
summary = "The line number to start reading from."

[conversation.tools.fs_read_file.parameters.end_line]
type = "integer"
summary = "The line number to stop reading at."
