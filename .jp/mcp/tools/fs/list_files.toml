[conversation.tools.fs_list_files]
enable = false
run = "unattended"

# Paths this tool may read but never returns. Their contents would either flood
# the response or expose something the model has no business seeing. Reading them
# is a separate question, governed by `access.fs` — `.git` in particular stays
# readable, since that is how the write tools check for uncommitted work.
#
# Patterns use `.ignore` syntax, so `**/target/` matches at any depth.
#
# Disclosure blocks like `.git/` belong on every tool that returns contents, so
# keep those in step. `**/target/` is a flood block and lives only on the tools
# that enumerate in bulk; `fs_read_file` omits it deliberately, so an exact build
# log stays retrievable (issue #626).
options.suppress = [".git/", "**/target/"]

source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "List files in the project's local filesystem."

examples = """
List all Rust files:
```json
{"extensions": ["rs"]}
```

List files under a specific directory:
```json
{"prefixes": ["crates/jp_cli/src"]}
```

List all files in the project:
```json
{}
```
"""

[conversation.tools.fs_list_files.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.fs_list_files.parameters.prefixes]
type = "array"
items.type = "string"
summary = "Optional list of path prefixes to filter the results by."
description = """
If unspecified, all files in the project are returned.
"""

[conversation.tools.fs_list_files.parameters.extensions]
type = "array"
items.type = "string"
summary = "Optional list of file extensions to filter the results by."
description = """
If unspecified, all extensions will be returned.
"""
