[conversation.tools.fs_grep_user_docs]
enable = false
run = "unattended"

# Paths this tool may read but never returns. Their contents would either flood
# the response or expose something the model has no business seeing. Reading them
# is a separate question, governed by `access.fs` — `.git` in particular stays
# readable, since that is how the write tools check for uncommitted work.
#
# Patterns use `.ignore` syntax, so `**/target/` matches at any depth.
#
# Disclosure blocks like `.git/` belong on every tool that returns contents, so
# keep those in step. `**/target/` is a flood block and lives only on the tools
# that enumerate in bulk; `fs_read_file` omits it deliberately, so an exact build
# log stays retrievable (issue #626).
options.suppress = [".git/", "**/target/"]

source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Grep the project's user documentation."

examples = """
Search for a topic:
```json
{"pattern": "tool configuration"}
```

Search with more surrounding context:
```json
{"pattern": "attachments", "context": 5}
```
"""

[conversation.tools.fs_grep_user_docs.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.fs_grep_user_docs.parameters.pattern]
type = "string"
required = true
summary = "Regular expression to filter the results by. Lookaround and backreferences are supported."

[conversation.tools.fs_grep_user_docs.parameters.context]
type = "integer"
default = 0
summary = "Number of lines of context to include before and after the matching lines."
