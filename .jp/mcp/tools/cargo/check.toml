[conversation.tools.cargo_check]
enable = false
run = "allow"
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Run `cargo check` for the given package, validating if the code compiles. Also reports doc comments that are badly formatted, which `cargo_fmt` auto-fixes, wiki pages a change broke, and new rustqual findings that fail CI."

examples = """
```json
{"package": "jp_cli"}
```

```json
{"package": ["jp_storage", "jp_workspace"]}
```

```json
{}
```
When no package is specified, all workspace packages will be checked.
"""

# Use content checksums instead of file mtimes for cargo's freshness checks,
# so sibling checkouts (git worktrees) sharing a target dir cannot serve each
# other's stale artifacts. Requires nightly cargo (rust-lang/cargo#14136);
# defaults to off so the tool also works on stable Rust.
options.checksum_freshness = true

# Run `jp wiki check` too: wiki pages link to line ranges and symbols in the
# source, so a code change can break one.
options.wiki_check = true

# Run the rustqual gate too, `qual diff` against the merge base with
# `origin/main`: the `qual` job on CI fails on a finding the base lacks. It
# analyses the whole workspace on every run, whatever `package` names. Needs
# `rustqual` on the `PATH` (`just _install-rustqual`); without it, the check
# says the gate didn't run.
options.qual_check = true

[conversation.tools.cargo_check.style]
inline_results = "full"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.cargo_check.parameters.package]
summary = "Package, or list of packages, to check in one run. If unspecified, all workspace packages will be checked. New rustqual findings are listed for these packages and counted for the others."
type = ["string", "array"]
items.type = "string"
