[conversation.tools.cargo_check]
enable = false
run = "allow"
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Run `cargo check` for the given package, validating if the code compiles. Also reports rustdoc errors the `docs` CI job fails on, doc comments that are badly formatted, which `cargo_fmt` auto-fixes, wiki pages a change broke, new rustqual findings that fail CI, and site files `jp vite sync` hasn't synced."

examples = """
```json
{"package": "jp_cli"}
```

```json
{"package": ["jp_storage", "jp_workspace"]}
```

```json
{}
```
When no package is specified, all workspace packages will be checked.
"""

# Use content checksums instead of file mtimes for cargo's freshness checks,
# so sibling checkouts (git worktrees) sharing a target dir cannot serve each
# other's stale artifacts. Requires nightly cargo (rust-lang/cargo#14136);
# defaults to off so the tool also works on stable Rust.
options.checksum_freshness = true

# Run `jp wiki check` too: wiki pages link to line ranges and symbols in the
# source, so a code change can break one.
options.wiki_check = true

# Run `cargo doc` with the flags from `just docs-ci` (the `docs` CI job), which
# fails on broken intra-doc links and other rustdoc warnings. Shares clippy's
# target directory, so cargo re-documents only crates whose sources or
# dependencies changed since the last run.
options.doc_check = true

# Pass `-Zrustdoc-mergeable-info` to `cargo doc`. Without this flag, each
# crate's rustdoc rewrites the shared search index under a lock, serializing
# doc builds and slowing down as the index grows (rust-lang/rust#146895): an
# edit to `jp_conversation` took 2m 43s to re-document its dependents, versus
# about 7s with the flag. Requires nightly cargo; defaults to `false` so the
# tool also works on stable Rust.
options.doc_mergeable_info = true

# Run the rustqual gate too, `qual diff` against the merge base with
# `origin/main`: the `qual` job on CI fails on a finding the base lacks. It
# analyses the whole workspace on every run, whatever `package` names. Needs
# `rustqual` on the `PATH` (`just _install-rustqual`); without it, the check
# says the gate didn't run.
options.qual_check = true

# Also run `jp-vite`'s `jp_site_is_synced` test (the same check run by the
# `docs` CI job). Changes under `crates/plugins/command/vite/site/` or to the
# ticket labels in `.jp/config.toml` must be synced into
# `docs/.vitepress/jp-vite/`, where `settings.json` records a content hash of
# the site files. Builds `jp-vite`'s tests from the working tree.
options.site_check = true

# Also run clippy for `wasm32-unknown-unknown` on the browser crates, those
# whose `Cargo.toml` sets `[package.metadata.jp] wasm = true` (see
# `docs/rfd/139-browser-uis-in-rust-with-leptos.md`). The host pass checks the
# same crates for the host, so this catches only what the browser build trips
# on. Off here; the `web-development` skill turns it on.
options.wasm_check = false

[conversation.tools.cargo_check.style]
inline_results = "full"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.cargo_check.parameters.package]
summary = "Package, or list of packages, to check in one run. If unspecified, all workspace packages will be checked. New rustqual findings are listed for these packages and counted for the others."
type = ["string", "array"]
items.type = "string"
