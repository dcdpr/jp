[conversation.tools.code_rename]
enable = false
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Rename Rust items everywhere they are used, in one call, as rust-analyzer resolves them."
description = """
Renames a function, method, type, field, variant, trait, constant, or local at its definition \
and at every use rust-analyzer resolves to it, across the workspace. A same-named item elsewhere \
is left alone, which a text replacement cannot promise. Prefer it to `fs_modify_file` for any \
rename that reaches past one file.

Each item is named the way `code_symbol` names a target. A name that matches more than one item \
is refused with the candidates; give `path` and `line` for the one meant.

Put every rename into one call's `renames`: they share one load of the workspace and one \
approval. They are made in order, each against the code the earlier ones left, and every target \
is found in the code as it is before the first. If any rename fails, no file is changed. A batch \
whose result would depend on its order is refused: two renames to one name, or a rename to a name \
another takes away, as a swap does.

The edits go through the same approval and uncommitted-changes checks as `fs_modify_file`. The \
answer is a summary, not the patch: each rename's number of edits, then each file with its count.

rust-analyzer does not rename the name inside `macro_rules!` bodies, strings, comments, or \
non-Rust files, it does not refuse a new name that is already taken, and it refuses a rename \
that would move a file, such as renaming a module. Run `cargo_check` afterwards.

Each call starts rust-analyzer and waits for it to load the workspace, which takes several \
seconds.
"""

examples = """
Rename a method:
```json
{"renames": [{"name": "Stream::iter", "new_name": "values"}]}
```

Rename a function and the field used on a line you are reading, in one call:
```json
{"renames": [
  {"name": "load", "path": "src/config.rs", "new_name": "read"},
  {"name": "config", "path": "src/editor.rs", "line": 120, "new_name": "base_config"}
]}
```
"""

# The patch is applied without asking, as `fs_modify_file` applies its own. An
# unanswered question re-runs the tool once answered, which starts
# rust-analyzer again.
questions.apply_changes.answer = true

[conversation.tools.code_rename.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.code_rename.parameters.renames]
type = "array"
required = true
summary = "The renames to make, in order."

[conversation.tools.code_rename.parameters.renames.items]
type = "object"
properties.name = { type = "string", required = true, description = "The item's name, qualified as far as needed to be unique: `iter`, `ConversationStream::iter`. Name a field through its type, as `Type::field`." }
properties.path = { type = "string", description = "File to look in, relative to the workspace root. Without `line`, the item this file defines with that name." }
properties.line = { type = "integer", description = "Line in `path` where the name appears, as `fs_read_file` numbers it before any rename: the item used there is renamed, wherever it is defined." }
properties.occurrence = { type = "integer", description = "Which appearance of the name on `line`, counting from 1. Needed only when it appears more than once." }
properties.new_name = { type = "string", required = true, description = "The new name: the identifier alone, without a path." }
