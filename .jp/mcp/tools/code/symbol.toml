[conversation.tools.code_symbol]
enable = false
# Starts rust-analyzer, which compiles and runs build scripts and proc macros
# while loading the workspace, just as `cargo_check` does.
run = "allow"
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Look up Rust symbols via rust-analyzer: definition, references, implementations, members, callers, and outgoing calls."
description = """
Resolves Rust symbols semantically through rust-analyzer, finding references to a specific \
symbol rather than every identifier with the same name. Prefer this tool over `fs_grep_files` \
when checking what calls, reads, constructs, or implements a Rust symbol, or when tracing a \
call chain up or down.

Each call starts a fresh rust-analyzer process and waits several seconds for it to load the \
workspace. Batch all symbols you want to inspect into a single call's `targets` array rather \
than calling the tool once per symbol.

Every target report starts with a header showing the symbol's full path, definition location, \
first doc-comment paragraph, and signature.

References are grouped by file and then by enclosing item. Non-test references are prioritized: \
each is shown at least as its own line, then expanded with surrounding context through the end \
of the statement it starts (such as a multi-line struct literal or call, up to 10 lines), and \
finally expanded to the full enclosing item (non-test items first, shortest items first) as the \
line budget permits. Partially shown items include their `start-end` line range so you can read \
them with `fs_read_file`. Files listed under `Not shown, over the output budget:` had too many \
references to fit even as single lines. \
Snippet lines follow the `fs_grep_files` format: `line:` marks a reference, `line-` marks \
context, `line=` marks a line matching `pattern`, and `--` separates non-adjacent blocks. \
Snippets are dedented, and shared lines across nested items are emitted only once.

```
src/stream.rs (1)
in fn total (27-29):
27-pub fn total(stream: &Stream) -> u32 {
28:    stream.iter().sum()
29-}
In tests, 2 in 2 files. Pass `tests: true` to show them:
src/stream_tests.rs (2)
```

The `References:` summary line always reports workspace-wide totals (overall, outside tests, and \
in tests). When output exceeds the line budget, files are compacted to fewer context lines or \
to per-file counts; use `paths` or `pattern` to narrow the results.

Implementations use the same layout and include test implementations by default (listed after \
non-test implementations). When both `implementations` and `references` are requested, \
implementations use at most half of the line budget.

Reference coverage in rust-analyzer:

- Included: function and method calls (including generic and `dyn` dispatch); field reads and \
writes (including inside `format!` and other macro arguments, destructuring patterns, struct \
literals, and field init shorthand like `Self { x }`); and `Self` references inside an `impl` \
block.
- Trait methods: calls through a trait resolve to the trait method (`Trait::method`), not to \
individual `impl` methods. Query `Trait::method` for callers, and request `implementations` to \
see each `impl` body. Trait method `references` exclude the `impl` declarations themselves so \
only call sites are counted.
- Excluded: occurrences inside `macro_rules!` definitions; references generated by `#[derive]` \
expansions (so a field read only by `Debug` or `Serialize` reports no references); `use` \
imports (excluded intentionally); and mentions in strings, comments, TOML, or Markdown. Check \
those with `fs_grep_files` before concluding that a symbol is unused.
"""

examples = """
Find callers of a method and readers of a field in one call:
```json
{"targets": [{"name": "ConversationStream::iter"}, {"name": "ConversationEventWithConfigRef::config"}]}
```

Inspect the symbol referenced on a specific line and show its definition:
```json
{"targets": [{"name": "iter", "path": "crates/jp_cli/src/cmd/query.rs", "line": 1577}], "show": ["definition"]}
```

Find all implementations of a trait:
```json
{"targets": [{"name": "Provider"}], "show": ["implementations"]}
```

Show how each type implements a trait method:
```json
{"targets": [{"name": "PersistBackend::write"}], "show": ["implementations"]}
```

Check which fields or methods of a type have no references:
```json
{"targets": [{"name": "CodeConfig"}], "show": ["members"]}
```

Filter callers of a method to enclosing items that also access `.config`:
```json
{"targets": [{"name": "ConversationStream::iter"}], "pattern": "[.]config"}
```

Trace incoming callers three levels up and outgoing calls from a function:
```json
{"targets": [{"name": "persist_conversation"}], "show": ["callers", "calls"], "depth": 3}
```

Check how a type is constructed and used (`references` shows struct literals in context, and \
`members` reports reference counts for constructors like `fn new`):
```json
{"targets": [{"name": "ToolCallRequest"}], "show": ["references", "members"]}
```
"""

[conversation.tools.code_symbol.style]
inline_results = "off"
results_file_link = "off"
parameters = "function_call"

[conversation.tools.code_symbol.parameters.targets]
type = "array"
required = true
items.type = "object"
items.properties.name = { type = "string", required = true, summary = "Symbol name, qualified as needed to be unique (e.g. `iter`, `ConversationStream::iter`). Qualify struct fields with their type (`Type::field`)." }
items.properties.path = { type = "string", summary = "Workspace-relative file path. When `line` is omitted, selects the item with `name` defined in this file." }
items.properties.line = { type = "integer", summary = "1-based line number in `path` where `name` appears. Selects the symbol referenced at that location, wherever it is defined." }
items.properties.occurrence = { type = "integer", summary = "1-based occurrence index of `name` on `line`. Only needed when the identifier appears more than once on that line." }
summary = "Symbols to look up by workspace name, by definition in `path`, or by usage at `path` and `line`."
description = """
Qualifiers are matched against both the enclosing type/trait and the module path, so \
`ConversationStream::iter` and `jp_conversation::ConversationStream` both work. `pub use` \
re-exports are deduplicated in favor of the original definition.

If a name matches up to three items, all of them are reported under separate headers. If it \
matches more than three, the tool returns the candidate list with file locations so you can \
add a qualifier or specify `path` and `line`.
"""

[conversation.tools.code_symbol.parameters.show]
type = "array"
items.type = "string"
items.enum = ["definition", "references", "implementations", "members", "callers", "calls"]
summary = "Sections to include after each target's header. Defaults to `[\"references\"]`."
description = """
- `definition`: full source of the item, including doc comments.
- `references`: every resolved use of the symbol.
- `implementations`: `impl` blocks for a trait or type, or each `impl` method body for a trait \
method.
- `members`: fields, variants, and inherent methods of a struct or enum, or methods of a trait. \
Reports non-test and test reference counts and up to five non-test usage locations per member \
(or `no references` when unused). Performs one reference lookup per member.
- `callers`: incoming call tree up to `depth` levels for a function or method, formatted as an \
indented list with each caller's first call location. Does not include source snippets (use \
`references` for call-site code). Repeated callers are expanded only once, and test callers are \
summarized by count unless `tests: true` is set. Calls through a trait object or generic bound \
resolve to `Trait::method` rather than the concrete `impl` method.
- `calls`: outgoing calls from a function or method, ordered by first call site, with callee \
definition locations and call line numbers. External callees (`std` and dependencies) are listed \
by name only, `#[derive]`-generated methods appear as `derived fn Type::clone`, and workspace \
struct or variant constructors are listed separately under `Types and variants it names:`.
"""

[conversation.tools.code_symbol.parameters.tests]
type = "boolean"
summary = "Show references and callers in test code in full instead of summarizing them by count. Implementations in tests are always shown."

[conversation.tools.code_symbol.parameters.pattern]
type = "string"
summary = "Single-line regex filter. Shows only references and implementations whose enclosing item has a line matching the regex (marked with `=`). Summary counts still reflect the full workspace."
description = """
Useful when a symbol has many references and you only want call sites whose enclosing function \
also performs another operation (e.g. callers that also access `.config` or call `flush`). \
Matched line by line against the enclosing item's source.
"""

[conversation.tools.code_symbol.parameters.depth]
type = "integer"
summary = "Number of caller levels to traverse for `callers` (1 to 5, default 2)."

[conversation.tools.code_symbol.parameters.paths]
type = "array"
items.type = "string"
summary = "Restrict displayed references and implementations to these workspace-relative files or directories. Summary counts still reflect the full workspace."
