[conversation.tools.ticket_move]
enable = false
source = "plugin.command.ticket.move"
summary = "Move a ticket to another column of the board, or another place in one."
description = """
Move one ticket on the board: to another column, to a place within its column,
or both in one call. Each column is a queue, worked from the top.

- `status` moves it to `todo`, `in progress`, or `done`; `done` closes it. A
  parent closes only once its children are all `done`. Closing a ticket with
  checklist items unchecked is allowed, and the result names them. Without
  `status`, the ticket stays in its column.
- `before` or `after` places it directly above or below another ticket, which
  has to be in the column it ends up in.
- `position` places it at the `top` or the `bottom` of that column.

Name at most one of `before`, `after`, and `position`. Without any of them, a
ticket moved to another column joins it below the tickets ranked there.

The result says where the ticket ended up: its place in the column, and the
ticket directly above it.
"""

examples = """
Put a ticket at the top of Todo, as the next thing to work on:
```json
{"id": "T-02wt0kx", "position": "top"}
```

Rank it directly below another one:
```json
{"id": "T-02wt0kx", "after": "T-02wt0m3"}
```

Start work on it, ahead of what is in progress already:
```json
{"id": "T-02wt0kx", "status": "in progress", "position": "top"}
```
"""

# Several moves in one call are made one at a time in the order written: each
# reads the board the one before it left.
fan_out = { concurrency = 1 }

[conversation.tools.ticket_move.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.ticket_move.parameters.id]
type = "string"
required = true
summary = "The ticket to move: `T-02wt0kx`, `T02wt0kx`, or `02wt0kx`."

[conversation.tools.ticket_move.parameters.status]
type = "string"
required = false
enum = ["todo", "in progress", "done"]
summary = "The column to move it to; `done` closes it. Omit it to stay in the same column."

[conversation.tools.ticket_move.parameters.before]
type = "string"
required = false
summary = "Place it directly above this ticket, which has to be in the column it ends up in."

[conversation.tools.ticket_move.parameters.after]
type = "string"
required = false
summary = "Place it directly below this ticket, which has to be in the column it ends up in."

[conversation.tools.ticket_move.parameters.position]
type = "string"
required = false
enum = ["top", "bottom"]
summary = "Place it at the top or the bottom of the column it ends up in."
