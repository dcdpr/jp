[conversation.tools.ticket_show]
enable = false
source = "local"
command = "just serve-tools {{context}} {{tool}}"
summary = "Read one ticket: its metadata, description, and full discussion."
description = """
Print a ticket with its comments numbered, so a reply can name the comment it
answers (`ticket_comment` takes that number as `re`).

The whole discussion comes back in one call — there is no pagination, because a
ticket that needs it should have been closed and split.
"""

examples = """
```json
{"id": "T0042"}
```
"""

[conversation.tools.ticket_show.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.ticket_show.parameters.id]
type = "string"
required = true
summary = "The ticket to read: `42`, `042`, or `T0042`."
