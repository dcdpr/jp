[conversation.tools.ticket_create]
enable = false
source = "plugin.command.ticket.create"
format = "allow"
summary = "File a work item as a ticket under docs/ticket/."
description = """
Create a ticket: a work item recorded as a markdown file in the repository and
tracked on the board. Its labels say what kind of work it is and which part of
the system it lands in.

Write a ticket when the work is clear enough to start, and an RFD when it needs
a design first. The signal is whether there is a decision to argue about: "the
tool call header misaligns below 80 columns" is a ticket even if the fix is
subtle; "how should tool output be bounded?" is an RFD even if the
implementation is trivial.

Write the steps or acceptance criteria of the work as a checklist in the body,
one `- [ ] item` per line: `ticket_edit` checks the items off as they land, and
`ticket_show` and `ticket_list` count them. A step that could be picked up and
merged on its own is a ticket of its own instead.

The ticket opens at status `Todo`, draws a collision-resistant id, and is
attributed to you (`jp`). The title becomes the filename slug, so
keep it short and specific: at most 60 characters, or the tool asks you for a
shorter one before it files anything.

Work that splits into several items sharing one goal is filed as a parent and
its children: the parent holds the shared context and tracks the group, and
each child names it as its `parent`. Write what the children share once, in the
parent's description, rather than repeating it in each. File the children in
one call.
"""

examples = """
File a bug with a description:
```json
{"title": "Tool call header misaligned", "body": "The header renders one \
column left of the body when the terminal is narrower than 80 columns.", \
"labels": ["type=bug", "client=cli", "package=jp_printer"]}
```

File a task with no description:
```json
{"title": "Bump the deny list", "labels": ["type=task"]}
```

File a task under a parent:
```json
{"title": "Bound tool output", "labels": ["type=task"], "parent": "T-02wt0kx"}
```
"""

# A title past the limit is put back as a question rather than an error, so the
# ticket is retitled without the body being sent a second time. The assistant
# wrote the title, so the assistant shortens it.
questions.shorter_title.target = "assistant"

# Several tickets filed in one call, such as the children of a new parent, are
# created one at a time in the order written, so their ids, and the order they
# sit in on the board, follow it. One that fails says nothing about the next.
fan_out = { concurrency = 1 }

[conversation.tools.ticket_create.style]
parameters = "tool"
inline_results = "full"
results_file_link = "off"

[conversation.tools.ticket_create.parameters.title]
type = "string"
required = true
summary = "One-line summary of the work, at most 60 characters. Becomes the heading and the filename slug."

[conversation.tools.ticket_create.parameters.body]
type = "string"
required = false
summary = "The description, as markdown. Omit for a ticket whose title says everything."

[conversation.tools.ticket_create.parameters.parent]
type = "string"
required = false
summary = "The ticket to file this one under, such as `T-02wt0kx`."
description = """
The parent tracks a group of related tickets and holds what they share. It has
to exist, can't itself sit under a parent, and can't be Done.
"""

# Not marked required here: `jp ticket tools sync` marks it when the board
# requires a label, and a value set here would compete with that one.
[conversation.tools.ticket_create.parameters.labels]
type = "array"
summary = "What kind of work this is and where it lands, as `key=value` labels."
description = """
Labels classify a ticket: `type` says what kind of work it is, and the others
say which part of the system it lands in. Give it exactly one `type`, which
every ticket carries, and every other label that fits.

Each label is a `key=value` pair. A key may be named more than once, which is
how a ticket spanning two crates says so: `["package=jp_cli",
"package=jp_config"]`.

A ticket whose work belongs to an RFD names it: `relevant-rfd=091`, once per
RFD. An RFD's tracking ticket names it with `tracking-rfd=091` instead, and an
RFD has at most one; `rfd_show` says whether it has one and which labels it
takes.

The labels are defined in the workspace configuration. A label outside them is
refused, and the refusal names the ones you can use.
"""

# The accepted values live in `synced.toml`, generated from
# `plugins.command.ticket.options.labels` by
# `jp ticket tools sync .jp/mcp/tools/ticket`.
[conversation.tools.ticket_create.parameters.labels.items]
type = "string"
