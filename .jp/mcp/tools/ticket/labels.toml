# Generated by `just ticket-labels-sync` from `docs/ticket/.labels.json`.
#
# The vocabulary lives with the tickets, because `jp ticket` and the docs build
# both read it and neither loads this config. This file mirrors the active
# labels into the tool schemas so the assistant is offered them rather than
# guessing.
#
# The mirror is a hint, not a contract. Nothing fails when it goes stale: the
# tools validate against `.labels.json`, so a label missing here still writes,
# and one left here after being deleted is refused with a message naming the
# real set. Re-run the recipe to bring it back in step.
#
# `ticket_create` is offered only the values it may add. `ticket_label` and
# `ticket_list` also get retired ones: replacing a whole set means naming a
# retired value to keep it, and finding what still carries one means
# filtering on it.
#
# RFD D38 replaces this file with a reference the loader resolves directly.

[conversation.tools.ticket_create.parameters.labels.items]
enum = [
  "client=cli",
  "client=macos",
  "client=web",
  "domain=conversation",
  "domain=llm",
  "domain=mcp",
  "domain=plugins",
  "domain=storage",
