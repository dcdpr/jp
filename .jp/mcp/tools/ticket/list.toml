[conversation.tools.ticket_list]
enable = false
source = "plugin.command.ticket.list"
summary = "List the tickets in the repository, in board order, by filing date, or by a label."
description = """
One line per ticket: id, status, filing date, title, labels, checklist progress,
and comment count.

Tickets come in board order by default: Todo, In Progress, then Done, each
column top first. The first Todo ticket is the next one to work on. Set `order`
to sort across all columns instead, either by filing date (`filed`) or by a
sortable label key such as `due`.

Use it to find what is open before filing something new, and to resolve a title
you half-remember into an id for `ticket_show`. Filter by status to read one
column of the board, by label to read one area of the system, by `query` to
find the tickets that mention something, or by `under` to read the children of
one parent.

A long listing comes a page at a time: the result ends with the page it shows,
how many there are, and the `page` to ask for next.

Files that don't parse as tickets are named at the end rather than skipped
silently.
"""

examples = """
Everything:
```json
{}
```

Only what is being worked on:
```json
{"status": "in progress"}
```

Only open bugs:
```json
{"status": "todo", "labels": ["type=bug"]}
```

Every ticket mentioning the wrap width, in its title, description, or comments:
```json
{"query": "wrap width"}
```

The second page of the open tickets:
```json
{"status": "todo", "page": 2}
```

Only tickets touching the CLI client and the config crate:
```json
{"labels": ["client=cli", "package=jp_config"]}
```

Every ticket carrying any `package` label:
```json
{"labels": ["package"]}
```

The open tickets filed under one parent:
```json
{"under": "T-02wt0kx", "status": "todo"}
```

The most recently filed tickets, whatever their status:
```json
{"order": "filed:desc"}
```

The open tickets due soonest, undated ones last:
```json
{"status": "todo", "order": "due"}
```
"""

[conversation.tools.ticket_list.style]
parameters = "function_call"
inline_results = "full"
results_file_link = "off"

[conversation.tools.ticket_list.parameters.status]
type = "string"
required = false
enum = ["todo", "in progress", "done"]
summary = "Only tickets at this status."

[conversation.tools.ticket_list.parameters.query]
type = "string"
required = false
summary = "Only tickets whose title, description, or comments contain this text, ignoring case."

[conversation.tools.ticket_list.parameters.under]
type = "string"
required = false
summary = "Only the tickets filed under this one, such as `T-02wt0kx`."

[conversation.tools.ticket_list.parameters.order]
type = "string"
required = false
enum = ["board", "filed", "filed:desc"]
summary = "How to order the tickets. Defaults to `board`."
description = """
- `board`: Todo, In Progress, then Done, each column in board order, top first.
- `filed`: by filing date across all statuses, oldest first (`filed:desc` for
  newest first).
- A sortable label key, such as `due`: by that label's value across all
  statuses (`<key>:desc` to reverse the order). Tickets without the label
  always sort last.
"""

# `jp ticket tools sync` adds the board's sortable label keys (`max = 1` with
# `type = "date"` or `ordered = true`) to `enum`.

[conversation.tools.ticket_list.parameters.page]
type = "integer"
required = false
summary = "Which page of the listing to show, counting from 1. Defaults to 1."

[conversation.tools.ticket_list.parameters.labels]
type = "array"
required = false
summary = "Only tickets carrying every one of these labels."
description = """
Each entry is a `key=value` pair, or a bare `key` to match any value under it.
Every entry has to match, so each one narrows the listing further.

Date-typed keys also support `<`, `<=`, `>`, and `>=` comparisons with a
`YYYY-MM-DD` date, such as `due<2026-12-01`.

Retired values are accepted here, which is how you find the tickets still
carrying one.
"""

# The accepted values live in `synced.toml`, generated from
# `plugins.command.ticket.options.labels` by
# `jp ticket tools sync .jp/mcp/tools/ticket`.
[conversation.tools.ticket_list.parameters.labels.items]
type = "string"
