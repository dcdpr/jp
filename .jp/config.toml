extends = [
    "config/personas/default.toml",
    "mcp/tools/**/*.toml",
]

config_load_paths = [
    ".jp/config",
    ".jp/config/personas",
]

[providers.llm]
anthropic.beta_headers = [
    "interleaved-thinking-2025-05-14",
    "context-management-2025-06-27",
]

# In-workspace MCP server for browsing Rust crate documentation from docs.rs.
#
# Runs the installed `bookworm` binary directly, so the server still starts when
# the justfile cannot be parsed. `just` (and a `cargo install`) only runs when the binary is
# missing. `JP_INSTALL=1 just _install-bookworm` picks up local source changes.
[providers.mcp.bookworm]
type = "stdio"
command = "sh"
arguments = [
    "-c",
    "command -v bookworm >/dev/null 2>&1 || just _install-bookworm >&2 || exit 1; exec bookworm mcp",
]

# `jp ticket` is served by a plugin in this repository, installed with
# `just _install-ticket` and found on $PATH. It is deliberately absent from the
# published registry, so approve it here rather than on every invocation. The
# binary is rebuilt often, and an approval is pinned to its contents.
[plugins.command.ticket]
run = "allow"

# Tickets and comments the assistant files through the `ticket_*` tools are
# attributed to `jp`. Every ticket written is laid out in the style of
# `.comfort.toml`, so it passes `fmt-markdown-ci` as it lands.
[plugins.command.ticket.options]
assistant = "jp"
format_on_write = true

# The labels a ticket can carry: each key, what it covers, and the values it
# takes. `jp ticket tools sync .jp/mcp/tools/ticket` mirrors them into the
# `ticket_*` tool definitions, and `jp vite sync` into the site.
[plugins.command.ticket.options.labels.client]
description = "The client surface"
values = ["cli", "macos", "web"]

[plugins.command.ticket.options.labels.llm-provider]
description = "The provider related to the ticket, if any"
values = ["anthropic", "cerebras", "google", "llamacpp", "ollama", "openai", "openrouter"]

[plugins.command.ticket.options.labels.domain]
description = "The subsystem, across whatever crates it spans."
values = ["conversation", "llm", "mcp", "plugins", "storage", "tooling"]

# What kind of work a ticket is: every ticket carries exactly one.
[plugins.command.ticket.options.labels.type]
description = "The type of ticket"
min = 1
max = 1
values = [
    "bug",
    "enhancement",
    "feature",
    "follow-up",
    "pre-rfd",
    "question",
    "task",
    "tracking",
]

# The RFD a tracking ticket stands for. A ticket tracks at most one RFD, and an
# RFD has at most one tracking ticket.
[plugins.command.ticket.options.labels.tracking-rfd]
description = "The RFD whose implementation this ticket tracks."
values = []
max = 1
unique = "key-value"

# Target date for the work (`YYYY-MM-DD`, e.g. `2026-11-25`). Supports
# comparison filters such as `due<2026-12-01`.
[plugins.command.ticket.options.labels.due]
description = "When the work is wanted, as a date: YYYY-MM-DD."
values = []
max = 1
type = "date"

# Any other RFD a ticket's work belongs to, such as one phase of its
# Implementation Plan.
[plugins.command.ticket.options.labels.relevant-rfd]
description = "An RFD this ticket's work belongs to."
values = []

[plugins.command.ticket.options.labels.package]
description = "Any relevant packages"
values = [
    "bookworm",
    "comfort",
    "grizzly",
    "jp_attachment",
    "jp_attachment_agentic_shepherd",
    "jp_attachment_bear_note",
    "jp_attachment_cmd_output",
    "jp_attachment_file_content",
    "jp_attachment_github",
    "jp_attachment_http_content",
    "jp_attachment_internal",
    "jp_attachment_mcp_resources",
    "jp_cli",
    "jp_config",
    "jp_conversation",
    "jp_editor",
    "jp_github",
    "jp_id",
    "jp_inquire",
    "jp_label",
    "jp_llm",
    "jp_macro",
    "jp_mcp",
    "jp_md",
    "jp_openrouter",
    "jp_plugin",
    "jp_printer",
    "jp_storage",
    "jp_task",
    "jp_term",
    "jp_test",
    "jp_tombmap",
    "jp_tool",
    "jp_workspace",
    "json_edit",
    "schematic",
    "xct2cli",
]

# `jp rfd` is served the same way, installed with `just _install-rfd`. Its
# directories and link labels are left at their defaults, which are JP's layout.
[plugins.command.rfd]
run = "allow"

# Drafts created by the `rfd_draft` tool are attributed to `jp`, and RFDs are
# formatted with `.comfort.toml` on write.
[plugins.command.rfd.options]
assistant = "jp"
format_on_write = true

# A tracking ticket carries `type=tracking` beside its `tracking-rfd` link, since
# every ticket here carries exactly one `type`.
[plugins.command.rfd.options.tracking]
labels = ["type=tracking"]

# `jp wiki` keeps what the project knows in `docs/wiki/`: how the system works,
# the glossary, and research. It is served the same way, installed with
# `just _install-wiki`. Its directory is left at its default.
[plugins.command.wiki]
run = "allow"

# Pages the assistant writes through the `wiki_*` tools are attributed to `jp`,
# and every page is laid out in the style of `.comfort.toml` as it is written.
[plugins.command.wiki.options]
assistant = "jp"
format_on_write = true

# The labels a page can carry. `domain` matches the tickets' vocabulary, so a
# note moved from a ticket keeps its labels. `jp wiki tools sync
# .jp/mcp/tools/wiki` mirrors them into the `wiki_*` tool definitions.
[plugins.command.wiki.options.labels.domain]
description = "The subsystem a page covers, across whatever crates it spans."
values = ["conversation", "llm", "mcp", "plugins", "storage", "tooling"]

[plugins.command.wiki.options.labels.relevant-rfd]
description = "An RFD this page relates to."
values = []

# `jp vite` keeps the site's RFD, ticket, and wiki pages in step with the three
# plugins above, installed with `just _install-vite`. The site reads its
# settings from `docs/.vitepress/jp-vite/settings.json`, which `jp vite sync`
# writes from this configuration.
[plugins.command.vite]
run = "allow"

# Pinned rather than read from each contributor's `origin` remote, so everyone
# writes the same settings, CI's clone included, which has no `origin/HEAD`.
[plugins.command.vite.options]
repository = "https://github.com/dcdpr/jp"
branch = "main"

