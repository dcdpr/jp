extends = [
    "config/personas/default.toml",
    "mcp/tools/**/*.toml",
]

config_load_paths = [
    ".jp/config",
    ".jp/config/personas",
]

[providers.llm]
anthropic.beta_headers = [
    "interleaved-thinking-2025-05-14",
    "context-management-2025-06-27",
]

# In-workspace MCP server for browsing Rust crate documentation from docs.rs.
#
# Runs the installed `bookworm` binary directly, so the server still starts when
# the justfile cannot be parsed. `just` (and a `cargo install`) only runs when the binary is
# missing. `JP_INSTALL=1 just _install-bookworm` picks up local source changes.
[providers.mcp.bookworm]
type = "stdio"
command = "sh"
arguments = [
    "-c",
    "command -v bookworm >/dev/null 2>&1 || just _install-bookworm >&2 || exit 1; exec bookworm mcp",
]

# `jp ticket` is served by a plugin in this repository, installed with
# `just _install-ticket` and found on $PATH. It is deliberately absent from the
# published registry, so approve it here rather than on every invocation.
[plugins.command.ticket]
run = "unattended"

[providers.llm.aliases]
# Anthropic aliases
anthropic = "anthropic/claude-sonnet-5-5"
claude = "anthropic/claude-sonnet-5-5"
sonnet = "anthropic/claude-sonnet-5-5"
opus = "anthropic/claude-opus-5-5"
fable = "anthropic/claude-fable-5-1"
haiku = "anthropic/claude-haiku-4-5"
zai = "cerebras/zai-glm-4.7"
# OpenAI aliases
openai = "openai/gpt-6.1-sol"
chatgpt = "openai/gpt-6.1-sol"
gpt = "openai/gpt-6.1-sol"
gpt5 = "openai/gpt-5.6-sol"
gpt55 = "openai/gpt-5.5"
astra = "openai/gpt-6-astra"
sol = "openai/gpt-6.1-sol"
terra = "openai/gpt-5.6-terra"
luna = "openai/gpt-6-luna"
gpt5-pro = "openai/gpt-5.5-pro"
gpt-pro = "openai/gpt-5.5-pro"
gpt5-mini = "openai/gpt-5.4-mini"
gpt-mini = "openai/gpt-5.4-mini"
gpt5-nano = "openai/gpt-5.4-nano"
gpt-nano = "openai/gpt-5.4-nano"
o3-research = "openai/o3-deep-research"
o4-mini-research = "openai/o4-mini-deep-research"
codex = "openai/gpt-5.3-codex"
gpt-5-codex = "openai/gpt-5-codex"
codex-mini = "openai/gpt-5.1-codex-mini"
# Google aliases
google = "google/gemini-3.1-pro-preview"
gemini = "google/gemini-3.1-pro-preview"
gemini-pro = "google/gemini-3.1-pro-preview"
gemini-flash = "google/gemini-3-flash-preview"
gemini-lite = "google/gemini-2.5-flash-lite"

# dcd models
dcd = "glm"
glm = "vllm/glm-5.3"

[providers.llm.vllm]
api_key_env = ["DCD_API_KEY", "VLLM_API_KEY"]
base_url = "http://model.api:8001"

[conversation.inquiry.assistant.model]
id = "haiku"
parameters.reasoning.effort = "auto"

[conversation.title.generate.model]
id = "haiku"
parameters.reasoning.effort = "low"

[style.code]
copy_link = "off"

[style.reasoning]
display = "full"

[conversation.tools.'*']
run = "ask"

# Record the VCS context a conversation was started in, so it can be found back
# with `jp c ls --label=branch=<name>`. Re-resolved on fork, because a fork is a
# new conversation started here and now, not a copy of where the source began.
[conversation.labels.branch]
value.cmd = "git branch --show-current"
apply_on = { new = true, fork = true }
run = "unattended"
optional = true

[conversation.labels.commit]
value.cmd = "git rev-parse --short HEAD"
apply_on = { new = true, fork = true }
run = "unattended"
optional = true

[conversation.labels.worktree]
value.cmd = { program = 'basename "$(git rev-parse --show-toplevel)"', shell = true }
apply_on = { new = true, fork = true }
run = "unattended"
optional = true
