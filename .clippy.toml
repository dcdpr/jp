disallowed-macros = []
disallowed-methods = []
disallowed-types = []

too-many-arguments-threshold = 10
doc-valid-idents = [
    "CommonMark",
    "LlamaCPP",
    "OpenAI",
    "OpenRouter",
    "SQLite",

    # Append Clippy's own list of valid identifiers.
    "..",
]
allow-unwrap-in-tests = true
allow-print-in-tests = true
allowed-duplicate-crates = [
    # `thiserror-impl` 2.0.20 parses with `syn` 3 while the rest of the
    # proc-macro ecosystem is still on 2, so the graph carries both. Nothing in
    # the workspace can collapse it: we pin `syn` 2, and moving to 3 would only
    # trade which half of the ecosystem disagrees. Drop this once they converge.
    "syn",
    "windows-core",
    "windows-implement",
    "windows-interface",
    "windows-link",
    "windows-result",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_gnullvm",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
]
# check-private-items = true
