[toolchain]
# We're using unstable options in e.g. `.rustfmt.toml` that require a nightly compiler. However, the
# project has the `unstable-features` lint set to `warn` (and `deny` on CI), so we can't
# accidentally use unstable features that would not work on the stable release.
#
# When releasing a new version of the binary, we build it with the stable compiler.
channel = "nightly-2026-11-24"
# `rust-src` is what rust-analyzer reads the standard library from. Without it
# rust-analyzer cannot expand `std` macros such as `assert_eq!`, and the
# `code_symbol` tool misses every reference inside one.
components = ["cargo", "rustfmt", "clippy", "rust-analyzer", "rust-src", "llvm-tools"]
# The browser UIs of command plugins compile to WebAssembly
# (`docs/rfd/139-browser-uis-in-rust-with-leptos.md`).
targets = ["wasm32-unknown-unknown"]
